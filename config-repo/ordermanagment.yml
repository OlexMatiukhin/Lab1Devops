spring:
  aplication:
    name:ordermanagment
  datasource:
    url: jdbc:postgresql://db:5432/orders_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    compatibility-verifier:
      enabled: false
server:
  port: 8081
eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 2
logging:
  level:
    org.springframework.cloud.bootstrap.config: DEBUG
    org.springframework.cloud.config.client.ConfigServicePropertySourceLocator: DEBUG