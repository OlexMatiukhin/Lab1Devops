name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build:
    name: build-java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Install sharedDTO
        working-directory: ./sharedDTO
        run: mvn -B clean install -DskipTests

      - name: Build ConfigServer
        working-directory: ./ConfigServer
        run: mvn -B -DskipTests package
      
      - name: Build Eureka
        working-directory: ./eureka
        run: mvn -B -DskipTests package

      - name: Build ClientManagment
        working-directory: ./ClientManagment
        run: mvn -B -DskipTests package

      - name: Build OrderMangment
        working-directory: ./OrderMangment
        run: mvn -B -DskipTests package
        
      - name: Build ProductInCartManagment
        working-directory: ./ProductInCartManagment
        run: mvn -B -DskipTests package

      - name: Build ProductManagment
        working-directory: ./ProductManagment
        run: mvn -B -DskipTests package

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
  test-java:
    name: test-java
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: maven
    
    - name: Install sharedDTO
      working-directory: ./sharedDTO
      run: mvn -B clean install -DskipTests

    - name: Build for Sonar
      working-directory: ./ClientManagment
      run: mvn -B clean package -DskipTests

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


    - name: Install sharedDTO
      working-directory: ./sharedDTO
      run: mvn -B clean install -DskipTests
    - name: Test ClientManagment
      working-directory: ./ClientManagment
      run: mvn -B test
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/postgres
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: admin

    - name: Test OrderMangment
      working-directory: ./OrderMangment
      run: mvn -B test
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/postgres
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: admin

    - name: Test ProductInCartManagment
      working-directory: ./ProductInCartManagment
      run: mvn -B test
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/postgres
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: admin

    - name: Test ProductManagment
      working-directory: ./ProductManagment
      run: mvn -B test
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/postgres
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: admin
    

    
