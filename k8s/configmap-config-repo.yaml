apiVersion: v1
kind: ConfigMap
metadata:
  name: config-repo
  namespace: ecommerce
data:
  clientmanagment.yml: |
    spring:
      application:
        name: clientmanagment
      datasource:
        url: jdbc:postgresql://db:5432/clients_db
        username: postgres
        password: admin
        driver-class-name: org.postgresql.Driver
      jpa:
        database: postgresql
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
          ddl-auto: create
        show-sql: true
        properties:
          hibernate:
            format_sql: true
      cloud:
        compatibility-verifier:
          enabled: false
        discovery:
          enabled: false
    server:
      port: 8080
    eureka:
      client:
        enabled: false
  ordermanagment.yml: |
    spring:
      application:
        name: ordermanagment
      datasource:
        url: jdbc:postgresql://db:5432/orders_db
        username: postgres
        password: admin
        driver-class-name: org.postgresql.Driver
      jpa:
        database: postgresql
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
          ddl-auto: create
        show-sql: true
        properties:
          hibernate:
            format_sql: true
      cloud:
        compatibility-verifier:
          enabled: false
        discovery:
          enabled: false
    server:
      port: 8081
    logging:
      level:
        org.springframework.cloud.bootstrap.config: DEBUG
        org.springframework.cloud.config.client.ConfigServicePropertySourceLocator: DEBUG
    eureka:
      client:
        enabled: false     

  productincartmanagment.yml: |
    spring:
      application:
        name: productincartmanagment
      datasource:
        url: jdbc:postgresql://db:5432/productincart_db
        username: postgres
        password: admin
        driver-class-name: org.postgresql.Driver
      jpa:
        database: postgresql
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
          ddl-auto: create
        show-sql: true
        properties:
          hibernate:
            format_sql: true
      cloud:
        compatibility-verifier:
          enabled: false
        discovery:
          enabled: false    
    server:
      port: 8082
    eureka:
      client:
        enabled: false

  productmanagment.yml: |
    spring:
      application:
        name: productmanagment
      datasource:
        url: jdbc:postgresql://db:5432/products_db
        username: postgres
        password: admin
        driver-class-name: org.postgresql.Driver
      jpa:
        database: postgresql
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
          ddl-auto: create
        show-sql: true
        properties:
          hibernate:
            format_sql: true
      cloud:
        compatibility-verifier:
          enabled: false
        discovery:
          enabled: false
    server:
      port: 8083
    eureka:
      client:
        enabled: false

