spring:
  application:
    name: productmanagment
  datasource:
    url: jdbc:postgresql://db:5432/products_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    compatibility-verifier:
      enabled: false
    discovery:
      enabled: false
server:
  port: 8083
eureka:
  client:
    enabled: false
