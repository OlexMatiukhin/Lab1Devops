services:
  configserver:
    build:
      context: .
      dockerfile: ./ConfigServer/Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: "file:/config-repo"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  eureka:
    build:
      context: .
      dockerfile: eureka/Dockerfile
    ports:
      - "8761:8761"
    depends_on:
        configserver:
          condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://configserver:8888
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health | grep UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s


  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  clientmanagment:
    build:
      context: .
      dockerfile: ClientManagment/Dockerfile
    depends_on:
      configserver:
          condition: service_healthy
      eureka:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://configserver:8888
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  ordermanagment:
    build:
      context: .
      dockerfile: OrderMangment/Dockerfile
    depends_on:
      configserver:
        condition: service_healthy
      eureka:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://configserver:8888
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  productincartmanagment:
    build:
      context: .
      dockerfile: ProductInCartManagment/Dockerfile
    depends_on:
      configserver:
        condition: service_healthy
      eureka:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://configserver:8888
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8082:8082"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  productmanagment:
    build:
      context: .
      dockerfile: ProductManagment/Dockerfile
    depends_on:
      configserver:
        condition: service_healthy
      eureka:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://configserver:8888
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8083:8083"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      clientmanagment:
        condition: service_healthy
      ordermanagment:
        condition: service_healthy
      productincartmanagment:
        condition: service_healthy
      productmanagment:
        condition: service_healthy
volumes:
  pgdata:


